<!DOCTYPE html>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Meddon&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-locked">
    <header id="site-header">
        <nav id="navbar">
            <ul>
                <li class="site-brand-item"><a href="index.html">Linh & Andrew</a></li>
                <li class="leaf-decoration"><img src="extra/symbol-nav.png" alt="Lotus symbol"></li>
                <li><a href="index.html">Home</a></li>
                <li><a href="schedule.html">Schedule</a></li>
                <li><a href="travel.html">Travel</a></li>
                <li><a href="rsvp.html">RSVP</a></li>
                <li><a href="faqs.html">FAQs</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Travel</h1>
        <section class="travel-feature">
            <a class="travel-card" href="https://www.notion.so/elenalouis/Vi-t-Nam-Guide-3692bd28c072807a9547ec831548dda9" target="_blank" rel="noopener noreferrer">
                <img class="travel-card-image" src="extra/travel.jpg" alt="Waterfront view in Viet Nam">
                <div class="travel-card-body">
                    <p class="travel-card-eyebrow">Travel Guide</p>
                    <h2 class="travel-card-title">Welcome to Vietnam!</h2>
                    <p class="travel-card-copy">We are honored you are joining us in our wedding and visiting Linh's home. Please check out this guide we've prepared.</p>
                    <span class="travel-card-link">Open the Vietnam Guide</span>

    <footer></footer>

    <div class="password-gate">
        <p class="password-gate__eyebrow">Private invitation</p>
        <h1 class="password-gate__title">Enter Password</h1>
        <form class="password-gate__form">
            <label class="password-gate__label" for="site-password">Password</label>
            <input
                class="password-gate__input"
                id="site-password"
                name="site-password"
                type="password"
                inputmode="text"
                autocomplete="current-password"
                autocapitalize="off"
                spellcheck="false"
                required
            >
            <p class="password-gate__error" aria-live="polite"></p>
            <button class="password-gate__button" type="submit">Open Site</button>
        </form>
    </div>

    <script src="js/script.js"></script>
